<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="js-widget-title" content="Weekly Progress">
<title>Weekly Progress</title>
<style>
  /* THE ONE DIAL: if the bottom of the wheel is cut off, make --box smaller (90vw, then 80vw).
     If there's empty space below the wheel, make it bigger. */
  :root { --box: 100vw; --bg:#2b2b33; --btn:#3f3f4a; --text:#f0f0f5; --sub:#a0a0ab; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none; }

  .box { position:relative; width:var(--box); height:var(--box); margin:0 auto; }

  .btn {
    position:absolute; top:calc(var(--box) * 0.025);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; font-weight:800; color:var(--text);
    --wweb2-overlay-btn-color: rgba(0,0,0,0);
    --wweb2-overlay-btn-press-color: rgba(255,255,255,0.25);
    --wweb2-overlay-btn-corner-radius: 50%;
    --wweb2-overlay-btn-padding: -6px;
  }
  .arrow {
    width:calc(var(--box) * 0.17); height:calc(var(--box) * 0.17);
    border-radius:50%; background:var(--btn);
    font-size:calc(var(--box) * 0.12); padding-bottom:calc(var(--box) * 0.012);
  }
  #prev { left:calc(var(--box) * 0.03); }
  #next { right:calc(var(--box) * 0.03); }
  .label {
    left:calc(var(--box) * 0.24); right:calc(var(--box) * 0.24);
    height:calc(var(--box) * 0.17);
    font-size:calc(var(--box) * 0.065);
  }

  svg { position:absolute; left:9%; top:19%; width:82%; height:82%; }
  .center { position:absolute; left:9%; top:19%; width:82%; height:82%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .pct  { font-weight:800; font-size:calc(var(--box) * 0.14); line-height:1; }
  .frac { font-weight:700; font-size:calc(var(--box) * 0.045); color:var(--sub); margin-top:calc(var(--box) * 0.01); }
</style>
</head>
<body>
<div class="box">
  <a class="btn arrow" id="prev"  href="#action=prev">‹</a>
  <a class="btn label" id="label" href="#action=today">this week</a>
  <a class="btn arrow" id="next"  href="#action=next">›</a>

  <svg id="svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="center">
    <div class="pct" id="pct">–</div>
    <div class="frac" id="frac">loading</div>
  </div>
</div>

<script>
(function () {
  var API   = 'https://script.google.com/macros/s/AKfycbxzDb4jpmzj2rf5wNCncRVA1B6dkNYPQGWTPcEGlGotFaezxDpsLGW9P5pf_Toeew7g/exec';
  var TOKEN = 'wheel-7k2m9q';

  var CACHE_KEY = 'wheel_cache_v1', CACHE_TTL = 15 * 60 * 1000;
  var CUTOUT = 0.6, MAX_THICK = 18, GAP = 2.5, R = 96;

  var COLORS = {
    'bch351':'#b2e2b6','biochem':'#b2e2b6','bio240':'#9ed2f6','anat+phys':'#9ed2f6',
    'bsc494':'#e4b39b','teaching':'#e4b39b','gn427':'#d3f1bf','bioinformatics':'#d3f1bf',
    'gn521':'#91e3d6','molgen':'#91e3d6','pb421':'#c2c7f8','plant phys':'#c2c7f8',
    'phi325':'#fbe0a3','bioethics':'#fbe0a3','e115':'#e2d5f8','computing':'#e2d5f8'
  };
  function colorFor(name) {
    var n = name.toLowerCase();
    if (COLORS[n]) return COLORS[n];
    var keys = Object.keys(COLORS);
    for (var i = 0; i < keys.length; i++) if (n.indexOf(keys[i]) !== -1) return COLORS[keys[i]];
    return '#A6A6B1';
  }

  function log(m) { try { if (typeof __wweb2Log === 'function') __wweb2Log(m); } catch (e) {} }

  function getCookie(k) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function setCookie(k, v) {
    document.cookie = k + '=' + encodeURIComponent(v) + '; max-age=31536000; path=/; SameSite=Lax';
  }

  var offset = parseInt(getCookie('wheelOffset') || '0', 10) || 0;
  var data = null, ready = false, failed = false;

  window.__wweb2WaitMillisecondsToWidgetIsReady = function () { return ready ? 0 : 250; };

  function apply(action) {
    if (action === 'prev') offset -= 1;
    else if (action === 'next') offset += 1;
    else if (action === 'today') offset = 0;
    else return false;
    setCookie('wheelOffset', String(offset));
    return true;
  }

  function weekRange() {
    var now = new Date(); now.setDate(now.getDate() + offset * 7);
    var s = new Date(now); s.setDate(now.getDate() - now.getDay()); s.setHours(0,0,0,0);
    var e = new Date(s);   e.setDate(s.getDate() + 6);              e.setHours(23,59,59,999);
    return { s: s.getTime(), e: e.getTime() };
  }
  function weekLabel() {
    if (offset === 0) return 'this week';
    if (offset === -1) return 'last week';
    if (offset === 1) return 'next week';
    return offset > 1 ? 'in ' + offset + ' wks' : Math.abs(offset) + ' wks ago';
  }

  function ringSvg(r, thick, pct, color) {
    var c = 2 * Math.PI * r, d = (pct / 100) * c;
    var base = '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke-width="' + thick + '"';
    var out = base + ' stroke="#3f3f4a"/>';
    if (pct > 0) {
      out += base + ' stroke="' + color + '" stroke-dasharray="' + d + ' ' + (c - d) +
             '" transform="rotate(-90 100 100)"/>';
    }
    return out;
  }

  function render() {
    document.getElementById('label').textContent = weekLabel();
    var svg = document.getElementById('svg');

    if (!data) {
      svg.innerHTML = ringSvg(R - 9, 18, 0, '#fff');
      document.getElementById('pct').textContent = '–';
      document.getElementById('frac').textContent = failed ? 'can\u2019t load' : '';
      return;
    }

    var r = weekRange();
    var week = data.assignments.filter(function (a) { return a.t >= r.s && a.t <= r.e; });
    var done = week.filter(function (a) { return a.d; }).length;

    function belongs(course, a) { return a.c && course.toLowerCase().indexOf(a.c.toLowerCase()) !== -1; }
    var courses = data.courses.filter(function (c) { return week.some(function (a) { return belongs(c, a); }); });

    var html = '';
    if (courses.length === 0) {
      html = ringSvg(R - 9, 18, 0, '#fff');
    } else {
      var thick = Math.min(MAX_THICK, (R * (1 - CUTOUT)) / courses.length);
      courses.forEach(function (c, i) {
        var mine = week.filter(function (a) { return belongs(c, a); });
        var pct = mine.length ? (mine.filter(function (a) { return a.d; }).length / mine.length) * 100 : 0;
        var rad = R - i * thick - thick / 2;
        html += ringSvg(rad, Math.max(thick - GAP, 2), pct, colorFor(c));
      });
    }
    svg.innerHTML = html;
    document.getElementById('pct').textContent = (week.length ? Math.round(done / week.length * 100) : 0) + '%';
    document.getElementById('frac').textContent = done + '/' + week.length + ' done';
  }

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
  }
  function writeCache(d) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data: d })); } catch (e) {}
  }
  function finish() { render(); ready = true; }

  function load(allowCache) {
    var cached = readCache();
    if (allowCache && cached && Date.now() - cached.at < CACHE_TTL) { data = cached.data; return finish(); }

    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 9000);
    fetch(API + '?token=' + encodeURIComponent(TOKEN), { signal: ctl.signal })
      .then(function (res) { return res.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error);
        data = j; writeCache(j);
      })
      .catch(function (e) {
        log('fetch failed: ' + e);
        if (cached) data = cached.data; else failed = true;
      })
      .then(function () { clearTimeout(timer); finish(); });
  }

  ['prev', 'label', 'next'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (ev) {
      ev.preventDefault();
      apply(this.getAttribute('href').replace('#action=', ''));
      load(true);
    });
  });

  var hash = window.location.hash.replace(/^#/, '');
  var action = new URLSearchParams(hash).get('action');
  var acted = action ? apply(action) : false;

  load(acted);
})();
</script>
</body>
</html>
