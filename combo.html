<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="js-widget-title" content="Assignments + Wheel">
<title>Assignments + Wheel</title>
<style>
  :root {
    --W: 100vw;       
    --RATIO: 0.467;   
    --u: calc(var(--W) / 100);
    --bg:#1c1c1e; --card:#2c2c2e; --line:#3a3a3c; --text:#f2f2f7; --sub:#ebebf599;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none; }
  a { text-decoration:none; color:inherit; }
  .box { position:relative; width:var(--W); height:calc(var(--W) * var(--RATIO)); background:var(--bg); overflow:hidden; }

  .tap {
    --wweb2-overlay-btn-color: rgba(0,0,0,0);
    --wweb2-overlay-btn-press-color: rgba(255,255,255,0.15);
    --wweb2-overlay-btn-padding: 0px;
  }

  .hdr { position:absolute; left:0; width:100%; top:calc(var(--u)*1.5); height:calc(var(--u)*5);
    display:flex; align-items:center; justify-content:center; }
  .htitle { font-weight:700; font-size:calc(var(--u)*3.6); }
  .badge { position:absolute; right:calc(var(--u)*4); background:var(--line); color:#e4e4e7; border-radius:calc(var(--u)*1.2);
    padding:calc(var(--u)*0.5) calc(var(--u)*1.4); font-weight:700; font-size:calc(var(--u)*2.2); }
  
  .toast { position:absolute; left:calc(var(--u)*3.5); top:calc(var(--u)*1.8); width:calc(var(--u)*4.5); height:calc(var(--u)*4.5);
    border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800;
    font-size:calc(var(--u)*2.6); color:#1c1c1e; z-index:30; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
  .toast.good { background:#b2e2b6; }
  .toast.bad  { background:#e4b39b; }
  .toast.load { background:#e2d5f8; font-size:calc(var(--u)*3.2); }

  .wheel { position:absolute; left:calc(var(--u)*1.5); top:calc(var(--u)*7.5); width:calc(var(--u)*38); height:calc(var(--u)*38); }
  .wheel svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .fill { transition: stroke-dasharray .8s cubic-bezier(.165,.84,.44,1); }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; padding:0 calc(var(--u)*6); text-align:center; }
  .pct  { font-weight:800; font-size:calc(var(--u)*7); line-height:1; }
  .frac { font-weight:700; font-size:calc(var(--u)*2.4); color:var(--sub); margin-top:calc(var(--u)*0.4); }

  .arrow { position:absolute; top:0; height:100%; width:50%; z-index:10; background:transparent; display:block; }
  #prev { left:0; border-top-left-radius: 50%; border-bottom-left-radius: 50%; }
  #next { right:0; border-top-right-radius: 50%; border-bottom-right-radius: 50%; }

  .list { position:absolute; left:calc(var(--u)*40.5); right:calc(var(--u)*2.5); top:calc(var(--u)*7.5); height:calc(var(--u)*37);
    display:flex; flex-direction:column; gap:calc(var(--u)*1.2); }
  .row { flex:1 1 0; min-height:0; display:flex; align-items:stretch; background:var(--card); 
    border-radius:calc(var(--u)*2.2); overflow:hidden; font-size:calc(var(--u)*2.6*var(--k,1)); }
  .chk { flex:0 0 calc(var(--u)*5.6); display:flex; align-items:center; justify-content:center; }
  .chk i { display:block; width:calc(var(--u)*2.6*var(--k,1)); height:calc(var(--u)*2.6*var(--k,1));
    border:calc(var(--u)*0.35) solid var(--sub); border-radius:50%; }
  .pill { align-self:center; flex:0 0 auto; border-radius:calc(var(--u)*0.9); padding:calc(var(--u)*0.35) calc(var(--u)*1.1);
    color:#1c1c1e; font-weight:800; font-size:0.8em; line-height:1.2; margin-right:calc(var(--u)*1); }
  .title { align-self:center; flex:1 1 0; min-width:0; text-align:left; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .type { align-self:center; flex:0 0 auto; margin-left:calc(var(--u)*0.8); background:var(--line); color:var(--text);
    border-radius:calc(var(--u)*0.7); padding:calc(var(--u)*0.3) calc(var(--u)*0.9); font-weight:800; font-size:0.72em; }
  .due { align-self:center; flex:0 0 auto; margin:0 calc(var(--u)*1.4) 0 calc(var(--u)*1); color:var(--sub); font-weight:600; font-size:0.8em; white-space:nowrap; }
  .empty { flex:1; display:flex; align-items:center; justify-content:center; border:1px dashed var(--line);
    border-radius:calc(var(--u)*1.8); color:var(--sub); font-weight:700; font-size:calc(var(--u)*3); }

  .pop { position:absolute; inset:0; z-index:20; background:rgba(28,28,30,0.94); display:none; align-items:center; justify-content:center; }
  .dialog { width:calc(var(--u)*62); background:var(--bg); border:1px solid var(--line); border-radius:calc(var(--u)*3); padding:calc(var(--u)*3); text-align:center; }
  .q { color:var(--sub); font-weight:700; font-size:calc(var(--u)*2.6); }
  .who { display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*1.2); margin:calc(var(--u)*1.8) 0 calc(var(--u)*2.8); }
  .who .pill { margin-right:0; font-size:calc(var(--u)*2.4); }
  .wname { font-weight:800; font-size:calc(var(--u)*3.2); text-align:left; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .acts { display:flex; gap:calc(var(--u)*2); }
  .act { flex:1; height:calc(var(--u)*8); border-radius:calc(var(--u)*2.2); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:calc(var(--u)*3); }
  .act.cancel { background:var(--line); color:var(--text); }
  .act.ok { background:#fff; color:var(--card); }
</style>
</head>
<body>
<div class="box">
  <div class="hdr" id="hdr"></div>
  <div id="toast-area"></div>

  <div class="wheel">
    <svg id="svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="center"><div class="pct" id="pct">–</div><div class="frac" id="frac">loading</div></div>
    
    <!-- Invisible buttons overlaying the left/right of the wheel -->
    <a class="tap arrow" id="prev"  data-act href="#action=prev"></a>
    <a class="tap arrow" id="next"  data-act href="#action=next"></a>
  </div>

  <div class="list" id="list"></div>
  <div class="pop" id="pop"></div>
</div>

<script>
(function () {
  var API   = 'https://script.google.com/macros/s/AKfycbxzDb4jpmzj2rf5wNCncRVA1B6dkNYPQGWTPcEGlGotFaezxDpsLGW9P5pf_Toeew7g/exec';
  var TOKEN = 'wheel-7k2m9q';

  var CUTOUT = 0.6, MAX_THICK = 18, GAP = 2.5, R = 96, MAX_ROWS = 5;

  var COLORS = {
    'bch351':'#b2e2b6','biochem':'#b2e2b6','bio240':'#9ed2f6','anat+phys':'#9ed2f6',
    'bsc494':'#e4b39b','teaching':'#e4b39b','gn427':'#d3f1bf','bioinformatics':'#d3f1bf',
    'gn521':'#91e3d6','molgen':'#91e3d6','pb421':'#c2c7f8','plant phys':'#c2c7f8',
    'phi325':'#fbe0a3','bioethics':'#fbe0a3','e115':'#e2d5f8','computing':'#e2d5f8'
  };
  function colorFor(name) {
    var n = String(name || '').toLowerCase();
    if (COLORS[n]) return COLORS[n];
    var keys = Object.keys(COLORS);
    for (var i = 0; i < keys.length; i++) if (n.indexOf(keys[i]) !== -1) return COLORS[keys[i]];
    return '#A6A6B1';
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function enc(s) { return encodeURIComponent(s == null ? '' : s); }
  function log(m) { try { if (typeof __wweb2Log === 'function') __wweb2Log(m); } catch (e) {} }
  function msgOf(e) { return String((e && e.message) || e || 'unknown').slice(0, 26); }
  
  function fmtDate(ts) {
    var d = new Date(ts);
    var days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    return days[d.getDay()] + ' ' + d.getDate();
  }

  var $ = function (id) { return document.getElementById(id); };
  var offset = 0; 
  var data = null, ready = false, confirmItem = null, toast = null, lastRings = [], loadErr = '';

  window.__wweb2WaitMillisecondsToWidgetIsReady = function () { return ready ? 0 : 250; };

  // FIX: Safely check if elements exist before interacting with them to prevent crashes
  ['prev', 'next'].forEach(function (id) { 
    var el = $(id);
    if (el) el.setAttribute('data-h', el.getAttribute('href') || ''); 
  });

  function valid(d) { return d && Array.isArray(d.assignments) && Array.isArray(d.courses); }

  function weekRange() {
    var now = new Date(); now.setDate(now.getDate() + offset * 7);
    var s = new Date(now); s.setDate(now.getDate() - now.getDay()); s.setHours(0,0,0,0);
    var e = new Date(s);   e.setDate(s.getDate() + 6);              e.setHours(23,59,59,999);
    return { s: s.getTime(), e: e.getTime() };
  }
  function weekLabel() {
    if (offset === 0) return 'this week';
    if (offset === -1) return 'last week';
    if (offset === 1) return 'next week';
    return offset > 1 ? 'in ' + offset + ' wks' : Math.abs(offset) + ' wks ago';
  }
  function belongs(course, a) { return a.c && course.toLowerCase().indexOf(String(a.c).toLowerCase()) !== -1; }
  function dashFor(r, pct) { var c = 2 * Math.PI * r, d = pct / 100 * c; return d + ' ' + (c - d); }

  function drawRings(list, animate) {
    var prev = lastRings; lastRings = list;
    var svg = $('svg'), html = '';
    list.forEach(function (g, i) {
      var start = animate ? (prev[i] ? prev[i].pct : 0) : g.pct;
      var base = '<circle cx="100" cy="100" r="' + g.rad + '" fill="none" stroke-width="' + g.w + '"';
      html += base + ' stroke="#3a3a3c"/>' + base + ' class="fill" stroke="' + g.color + '" stroke-dasharray="' + dashFor(g.rad, start) + '" transform="rotate(-90 100 100)"/>';
    });
    svg.innerHTML = html;
    if (animate) {
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        var els = svg.querySelectorAll('.fill');
        for (var i = 0; i < els.length; i++) els[i].setAttribute('stroke-dasharray', dashFor(list[i].rad, list[i].pct));
      }); });
    }
  }

  function renderInner(animate) {
    var wLabel = weekLabel();
    var titleHtml = '<a class="tap htitle" data-act href="#action=refresh">assignments ' + wLabel + '</a>';

    if (!valid(data)) {
      drawRings([{ rad: R - 9, w: 18, pct: 0, color: '#fff' }], false);
      $('pct').textContent = '–';
      $('frac').textContent = loadErr ? 'error' : 'loading';
      $('hdr').innerHTML = titleHtml;
      $('toast-area').innerHTML = '';
      $('list').innerHTML = '<div class="empty">' + (loadErr ? 'can\u2019t load' : 'loading\u2026') + '</div>';
      $('pop').style.display = 'none';
      return;
    }

    var rg = weekRange();
    var week = data.assignments.filter(function (a) { return a.t >= rg.s && a.t <= rg.e; });
    var done = week.filter(function (a) { return a.d; }).length;
    var courses = data.courses.filter(function (c) { return week.some(function (a) { return belongs(c, a); }); });
    var rings = [];
    
    if (!courses.length) rings.push({ rad: R - 9, w: 18, pct: 0, color: '#fff' });
    else {
      var thick = Math.min(MAX_THICK, (R * (1 - CUTOUT)) / courses.length);
      courses.forEach(function (c, i) {
        var mine = week.filter(function (a) { return belongs(c, a); });
        var pct = mine.length ? (mine.filter(function (a) { return a.d; }).length / mine.length) * 100 : 0;
        rings.push({ rad: R - i * thick - thick / 2, w: Math.max(thick - GAP, 2), pct: pct, color: colorFor(c) });
      });
    }
    drawRings(rings, animate);
    $('pct').textContent = (week.length ? Math.round(done / week.length * 100) : 0) + '%';
    $('frac').textContent = done + '/' + week.length + ' done';

    var open = week.filter(function (a) { return !a.d; }).sort(function (x, y) { return (x.t - y.t) || (x.r - y.r); });
    var shown = open.slice(0, MAX_ROWS);
    var badge = open.length > MAX_ROWS ? MAX_ROWS + ' of ' + open.length : open.length + ' due';

    $('hdr').innerHTML = titleHtml + '<span class="badge">' + badge + '</span>';

    if (toast) {
      var sym = toast.msg ? '\u21BB' : (toast.ok ? '\u2713' : '!');
      var cls = toast.msg ? 'load' : (toast.ok ? 'good' : 'bad');
      $('toast-area').innerHTML = '<div class="toast ' + cls + '">' + sym + '</div>';
    } else $('toast-area').innerHTML = '';

    var k = 1 + (MAX_ROWS - Math.max(shown.length, 1)) * 0.08;
    var html = '';
    if (!shown.length) html = '<div class="empty">' + (week.length ? 'all done \u2713' : 'nothing due') + '</div>';
    else {
      shown.forEach(function (a) {
        var href = '#action=ask&row=' + a.r + '&n=' + enc(a.n) + '&c=' + enc(a.c);
        var chk = confirmItem ? '<div class="chk"><i></i></div>' : '<a class="tap chk" data-act href="' + esc(href) + '"><i></i></a>';
        html += '<div class="row" style="--k:' + k + '">' + chk +
          '<span class="pill" style="background:' + colorFor(a.c) + '">' + esc(a.c) + '</span>' +
          '<span class="title">' + esc(a.n) + '</span>' +
          (a.y ? '<span class="type">' + esc(a.y) + '</span>' : '') +
          '<span class="due">' + fmtDate(a.t) + '</span></div>';
      });
    }
    $('list').innerHTML = html;

    var pop = $('pop');
    if (confirmItem) {
      var doneHref = '#action=done&row=' + enc(confirmItem.r) + '&n=' + enc(confirmItem.n) + '&c=' + enc(confirmItem.c);
      pop.innerHTML =
        '<div class="dialog"><div class="q">mark as done?</div>' +
        '<div class="who"><span class="pill" style="background:' + colorFor(confirmItem.c) + '">' + esc(confirmItem.c) + '</span>' +
        '<span class="wname">' + esc(confirmItem.n) + '</span></div>' +
        '<div class="acts"><a class="tap act cancel" data-act href="#action=cancel">cancel</a>' +
        '<a class="tap act ok" data-act href="' + esc(doneHref) + '">yes</a></div></div>';
      pop.style.display = 'flex';
    } else {
      pop.innerHTML = ''; pop.style.display = 'none';
    }
    
    // FIX: Safely check if elements exist
    ['prev', 'next'].forEach(function (id) {
      var el = $(id);
      if (el) {
        if (confirmItem) el.removeAttribute('href'); else el.setAttribute('href', el.getAttribute('data-h') || '');
      }
    });
  }

  function render(animate) {
    try { renderInner(animate); } catch (e) {
      log('render error: ' + e);
      try { $('pct').textContent = '!'; $('frac').textContent = 'error: ' + msgOf(e); } catch (e2) {}
    }
  }

  function api(qs, ms) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, ms || 9000);
    var fullUrl = API + '?token=' + enc(TOKEN) + (qs ? '&' + qs : '') + '&_cb=' + Date.now();
    return fetch(fullUrl, { signal: ctl.signal, redirect: 'follow', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { clearTimeout(t); if (j && j.error) throw new Error(j.error); return j; },
            function (e) { clearTimeout(t); throw e; });
  }

  function load(then, force) {
    api(force ? 'force=1' : '', 9000)
      .then(function (j) { 
        if (!valid(j)) throw new Error('bad data'); 
        data = j; 
        loadErr = ''; 
        try { localStorage.setItem('wheelDataCache', JSON.stringify(j)); } catch (e) {} 
      })
      .catch(function (e) { log('fetch failed: ' + e); loadErr = msgOf(e); })
      .then(then);
  }

  function findItem(item) {
    if (!valid(data)) return null;
    var list = data.assignments, i;
    for (i = 0; i < list.length; i++) if (String(list[i].r) === String(item.r) && list[i].n === item.n && list[i].c === item.c) return list[i];
    for (i = 0; i < list.length; i++) if (list[i].n === item.n && list[i].c === item.c && !list[i].d) return list[i];
    return null;
  }

  function doDone(item) {
    var m = findItem(item);
    if (m) m.d = true;                     
    toast = { ok: true, msg: 'saving...' };
    
    try { localStorage.setItem('wheelDataCache', JSON.stringify(data)); } catch (e) {} 
    
    render(false); 

    var payload = { token: TOKEN, action: 'done', row: item.r, n: item.n, c: item.c };
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 12000);

    fetch(API, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain' },
      signal: ctl.signal,
      redirect: 'follow'
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(t);
        if (j && j.ok) toast = { ok: true };
        else { if (m) m.d = false; toast = { ok: false }; }
      })
      .catch(function (e) {
        clearTimeout(t); log('done failed: ' + e);
        if (m) m.d = false; toast = { ok: false };
      })
      .then(function () {
        load(function () { render(false); ready = true; }); 
      });
  }

  function navStep(act) {
    if (act === 'prev') offset -= 1; else if (act === 'next') offset += 1; else offset = 0;
  }
  function itemFrom(p) { return { r: p.get('row'), n: p.get('n') || '', c: p.get('c') || '' }; }
  function isNav(a) { return a === 'prev' || a === 'next' || a === 'today'; }

  function processHashAction() {
    var qs = window.location.hash;
    if (qs.startsWith("#")) qs = qs.substring(1);
    if (!qs) return false;

    var p = new URLSearchParams(qs);
    var act = p.get('action');
    if (!act) return false;

    toast = null;
    ready = true; 

    if (isNav(act)) { navStep(act); confirmItem = null; }
    else if (act === 'ask') confirmItem = itemFrom(p);
    else if (act === 'cancel') confirmItem = null;
    else if (act === 'done') { 
      var it = itemFrom(p); confirmItem = null; 
      window.history.replaceState(null, null, ' ');
      doDone(it); 
      return true; 
    }
    else if (act === 'refresh') {
      toast = { ok: true, msg: 'refreshing...' };
      render(false);
      window.history.replaceState(null, null, ' ');
      load(function () { toast = null; render(false); }, true); 
      return true;
    }
    window.history.replaceState(null, null, ' ');
    return false;
  }
  
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[data-act]') : null;
    if (!a) return;
    ev.preventDefault();
    ev.stopPropagation();
    window.location.hash = a.getAttribute('href');
    processHashAction();
    render(true);
  });

  // FIX: Initialization Sequence
  var hasCache = false;
  try {
    var cached = localStorage.getItem('wheelDataCache');
    if (cached) {
      data = JSON.parse(cached);
      hasCache = true;
    }
  } catch (e) {}

  // Instantly render cache on screen so it is never blank while fetching
  if (hasCache) render(false);

  var loadingData = processHashAction();
  if (!loadingData) {
    load(function () { 
      render(false); 
      ready = true; // Tell iOS we are fully done fetching and to take the snapshot
    });
  }
})();
</script>
</body>
</html>
