  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    position: fixed; 
    top: 0; left: 0; right: 0; bottom: 0;
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden; 
  }

  .content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: scroll; 
    -webkit-overflow-scrolling: touch;
    padding-top: calc(env(safe-area-inset-top) + 24px); 
    padding-left: 16px;
    padding-right: 16px;
    padding-bottom: calc(110px + env(safe-area-inset-bottom)); 
  }

  .view { display: none; animation: fadeIn 0.15s ease-out; }
  .view.active { display: block; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 { 
    font-size: 34px; 
    font-weight: 800; 
    letter-spacing: -0.5px; 
    text-transform: lowercase; 
    margin-top: 0px; 
    margin-bottom: 20px;
  }
  
  /* Added bright colorful gradients here specifically so you can test and SEE the true glass blur effect */
  .placeholder-card { background: linear-gradient(135deg, #1C1C1E, #2C2C2E); height: 300px; border-radius: 16px; margin-bottom: 20px; }
  .placeholder-card.color-1 { background: linear-gradient(135deg, #FF3B30, #FF9500); height: 500px;}
  .placeholder-card.color-2 { background: linear-gradient(135deg, #34C759, #00C7BE); height: 500px;}
  .placeholder-card.color-3 { background: linear-gradient(135deg, #007AFF, #5856D6); height: 500px;}

  /* Floating Pill Nav Bar */
  .nav-bar {
    position: fixed;
    /* Reverted height placement to be aggressively low like Iteration 1 */
    bottom: calc(4px + env(safe-area-inset-bottom));
    left: 12px;
    right: 12px;
    height: 64px;
    background: var(--bar-bg);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border-radius: 32px; 
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding: 0 4px;
    z-index: 1000;
  }

  /* The actual animated pill background */
  .nav-indicator {
    position: absolute;
    top: 6px;
    bottom: 6px;
    width: calc((100% - 8px) / 5); /* 5 tabs */
    background: var(--active-bg);
    border-radius: 26px;
    z-index: 0;
    /* Spring-like transition for the native iOS tab slide feel */
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.35, 1);
    transform: translateX(0);
  }

  .nav-item {
    position: relative;
    z-index: 1; /* Keep above the sliding indicator */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--sub); text-decoration: none;
    font-size: 10px; font-weight: 500; 
    flex: 1;
    height: 100%;
    transition: color 0.2s ease;
  }
  
  .nav-item.active { color: var(--tint); }
  .nav-item svg { width: 24px; height: 24px; margin-bottom: 3px; fill: currentColor; }
</style>

  <script>
    const navItems = document.querySelectorAll('.nav-item');
    const views = document.querySelectorAll('.view');
    const indicator = document.getElementById('nav-indicator');

    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        
        // Remove active state from items
        navItems.forEach(nav => nav.classList.remove('active'));
        views.forEach(view => view.classList.remove('active'));
        
        // Add active state to clicked item
        item.classList.add('active');
        document.getElementById(item.getAttribute('data-target')).classList.add('active');
        
        // Animate the pill indicator using CSS transforms based on index
        const index = item.getAttribute('data-index');
        indicator.style.transform = `translateX(${index * 100}%)`;
      });
    });
  </script>
