<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="assignments">
<title>assignments</title>
<style>
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --text: #FFFFFF;
    --sub: #8E8E93; 
    --tint: #0A84FF; 
    --bar-bg: rgba(25, 25, 25, 0.32); 
    --active-bg: rgba(0, 0, 0, 0.35); 
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0; padding: 0;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; 
  }

  .content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: scroll; -webkit-overflow-scrolling: touch;
    padding-top: calc(env(safe-area-inset-top) + 22px); 
    padding-left: 12px; padding-right: 12px; padding-bottom: 120px; 
  }

  .view { display: none; animation: fadeIn 0.15s ease-out; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; text-transform: lowercase; margin-top: 0px; margin-bottom: 20px; }
  
  .placeholder-card { background: var(--card); height: 300px; border-radius: 16px; margin-bottom: 20px; }
  .placeholder-card.tall { height: 600px; }

  /* Nav Bar (Untouched from Phase 1 Final) */
  .nav-bar {
    position: fixed; bottom: 12px; left: 12px; right: 12px; height: 64px;
    background: var(--bar-bg); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
    border-radius: 32px; display: flex; justify-content: space-evenly; align-items: center; padding: 0 4px; z-index: 1000;
    --active-index: 0; 
  }
  .nav-indicator {
    position: absolute; top: 6px; bottom: 6px; left: 4px; width: calc((100% - 8px) / 5);
    background: var(--active-bg); border-radius: 26px; z-index: 0; pointer-events: none; 
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.35, 1);
    transform: translateX(calc(100% * var(--active-index)));
  }
  .nav-item {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--sub); text-decoration: none; font-size: 10px; font-weight: 500; flex: 1; height: 100%;
    touch-action: manipulation; transition: color 0.2s ease, opacity 0.2s ease;
  }
  .nav-item:active { opacity: 0.6; }
  .nav-item.active { color: var(--tint); opacity: 1; }
  .nav-item svg { width: 24px; height: 24px; margin-bottom: 3px; }

  /* --- NEW PHASE 2 WHEEL CSS --- */
  .week-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 0 10px;
  }
  .week-nav-btn {
    width: 44px; height: 44px; border-radius: 22px; background: var(--card); color: var(--text);
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    font-size: 24px; font-weight: bold; padding-bottom: 4px; transition: opacity 0.2s;
  }
  .week-nav-btn:active { opacity: 0.5; }
  .week-label { font-size: 18px; font-weight: 700; color: var(--sub); text-transform: lowercase; }

  .wheel-container {
    position: relative; width: 100%; max-width: 320px; aspect-ratio: 1/1; margin: 0 auto 40px auto;
  }
  .wheel-container svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wheel-ring { transition: stroke-dasharray 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); }
  .wheel-center {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;
  }
  .wheel-pct { font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -1px; }
  .wheel-frac { font-weight: 700; font-size: 16px; color: var(--sub); margin-top: 4px; }
  
  .error-toast { color: #FF3B30; font-size: 14px; text-align: center; margin-top: 10px; font-weight: 600; display: none; }

  /* --- PHASE 2.3: NATIVE iOS STYLE --- */
  :root { --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --spring: cubic-bezier(.32,.72,0,1); }
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 800; height: calc(env(safe-area-inset-top) + 44px); padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-transform: lowercase;
    background: rgba(0,0,0,.3); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    border-bottom: .5px solid var(--sep); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .topbar.show { opacity: 1; }
  .seg { position: relative; display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 4px; --n: 3; --i: 0; }
  .seg i { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); background: #636366; border-radius: 7px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .35s var(--spring); transform: translateX(calc(100% * var(--i))); }
  .seg button { position: relative; flex: 1; border: 0; background: none; color: var(--text); font: 600 13px/32px inherit; font-family: inherit; touch-action: manipulation; }
  .grp { font-size: 13px; color: var(--sub); margin: 22px 16px 7px; }
  .grp.late { color: #FF453A; }
  .group { background: var(--card); border-radius: 16px; overflow: hidden; }
  #view-assignments .task:not(.gr-row) { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .task { position: relative; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 7px 16px 7px 6px; max-height: 80px;
    transition: opacity .3s, max-height .4s var(--spring), min-height .4s var(--spring), padding .4s var(--spring), background .15s; }
  .task:active { background: #2C2C2E; }
  .task + .task::before, .lrow + .lrow::before { content: ''; position: absolute; top: 0; left: 16px; right: 16px; height: .5px; background: var(--sep); }
  .task.out { opacity: 0; max-height: 0; min-height: 0; padding-top: 0; padding-bottom: 0; }
  .chk { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; touch-action: manipulation; }
  .chk i { width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--c); display: flex; align-items: center; justify-content: center; transition: background .2s; }
  .chk i svg { opacity: 0; transform: scale(.4); transition: opacity .2s, transform .35s var(--spring); }
  .task.done .chk i { background: var(--c); }
  .task.done .chk i svg { opacity: 1; transform: none; }
  .tmain { flex: 1; min-width: 0; }
  .tname { font-size: 17px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.2px; }
  .task.done .tname { color: var(--sub); }
  .tsub { font-size: 13px; line-height: 18px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tsub b { font-weight: 600; }
  .tg { color: var(--sub); font-size: 17px; font-variant-numeric: tabular-nums; }
  .srow { padding-left: 16px; justify-content: space-between; }
  .lrow { position: relative; display: flex; align-items: center; width: 100%; text-align: left; background: none; border: 0; color: var(--tint); font-family: inherit; font-size: 17px; font-weight: 400; line-height: 22px; text-decoration: none; padding: 0 16px; min-height: 52px; -webkit-appearance: none; appearance: none; }
  .lrow:active { background: #2C2C2E; }
  .empty { color: var(--sub); text-align: center; padding: 56px 0; font-size: 17px; }
  .empty-row { color: var(--sub); text-align: center; padding: 22px 0; font-size: 15px; }
  .undo { position: fixed; left: 16px; right: 16px; bottom: 92px; z-index: 900; display: flex; justify-content: space-between; align-items: center;
    background: rgba(44,44,46,.4); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    border-radius: 22px; padding: 4px 6px 4px 18px; font-size: 15px; min-height: 44px;
    opacity: 0; transform: translateY(10px) scale(.98); pointer-events: none; transition: opacity .25s, transform .35s var(--spring); }
  .undo.show { opacity: 1; transform: none; pointer-events: auto; }
  .undo button { border: 0; background: none; color: var(--tint); font-size: 15px; font-weight: 600; padding: 10px 14px; font-family: inherit; }
  .content { scrollbar-width: none; } .content::-webkit-scrollbar { display: none; }
  .week-header { margin-bottom: 16px; }
  .hero { display: flex; gap: 12px; align-items: stretch; margin-bottom: 12px; }
  .hero .wheel-container { flex: none; width: 46%; max-width: 180px; margin: 0; }
  .hero .wheel-pct { font-size: 36px; letter-spacing: -.5px; } .hero .wheel-frac { font-size: 12px; margin-top: 2px; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .tile { flex: 1; min-width: 0; background: var(--card); border-radius: 16px; padding: 11px 14px; display: flex; flex-direction: column; justify-content: center; }
  .tl { font-size: 12px; color: var(--sub); } .tv { font-size: 26px; font-weight: 700; line-height: 30px; letter-spacing: -.5px; }
  .tn { font-size: 15px; font-weight: 600; line-height: 19px; max-height: 38px; overflow: hidden; margin-top: 2px; } .ts { font-size: 12px; color: var(--sub); }
  /* --- 2.5: liquid glass (visual only; nav position/size rules above are untouched) --- */
  .nav-bar { background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 48%, rgba(255,255,255,.07) 100%), rgba(24,24,26,.14);
    -webkit-backdrop-filter: blur(28px) saturate(210%) brightness(1.08); backdrop-filter: blur(28px) saturate(210%) brightness(1.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.26), inset 0 -1px 0 rgba(255,255,255,.06), inset 0 0 0 .5px rgba(255,255,255,.14), inset 0 0 22px rgba(255,255,255,.035), 0 10px 30px rgba(0,0,0,.5); }
  .nav-bar::before { content: ''; position: absolute; left: 16px; right: 16px; top: 1px; height: 42%; border-radius: 30px 30px 50% 50% / 30px 30px 20px 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,0)); pointer-events: none; z-index: 0; }
  .nav-indicator { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.07));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 .5px rgba(255,255,255,.15), 0 2px 8px rgba(0,0,0,.25); }
  .topbar { background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)), rgba(0,0,0,.14); box-shadow: inset 0 -.5px 0 rgba(255,255,255,.1); }
  .undo { background: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.05)), rgba(30,30,32,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 0 .5px rgba(255,255,255,.15), 0 8px 24px rgba(0,0,0,.4); }
  .seg i { box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.3); }
  /* quieter, centered week switcher; smaller wheel text so rings can grow */
  .week-header { justify-content: center; gap: 2px; padding: 0; margin-bottom: 8px; }
  .week-nav-btn { width: 40px; height: 32px; border-radius: 16px; background: transparent; color: var(--sub); font-size: 20px; font-weight: 500; padding-bottom: 2px; }
  .week-label { font-size: 13px; font-weight: 500; color: #636366; min-width: 86px; text-align: center; }
  .hero .wheel-pct { font-size: 32px; } .hero .wheel-frac { font-size: 11px; }
  /* weather art */
  .tv small { font-size: 12px; font-weight: 500; color: var(--sub); letter-spacing: 0; }
  /* 2.6 layout: switcher above wheel (left column), tiles fill the right column */
  .hero { align-items: stretch; }
  .lcol { flex: none; width: 46%; max-width: 180px; display: flex; flex-direction: column; align-items: center; }
  .lcol .week-header { width: 100%; margin-bottom: 6px; }
  .lcol .wheel-container { width: 100%; max-width: none; }
  .week-nav-btn { width: 32px; } .week-label { min-width: 70px; }
  .tile { align-items: center; text-align: center; padding: 8px 10px; }
  .tv { font-size: 24px; line-height: 28px; }
  .wxart { width: 56px; height: 38px; margin: 0 auto 2px; }
  .wxart svg { width: 100%; height: 100%; display: block; }
  /* 2.7: dashboard cards left-aligned (3), weather icon on the right */
  .side { gap: 8px; }
  .tile { align-items: flex-start; text-align: left; padding: 7px 12px; }
  .tile.wx { flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; }
  .wtxt { min-width: 0; } .wxart { flex: none; width: 50px; height: 36px; margin: 0; }
  .tv { font-size: 22px; line-height: 26px; }
  .tn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; max-height: none; margin-top: 1px; }
  /* 2.7: add button + edit/add sheet */
  .hrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; } .hrow h1 { margin: 0; }
  .plus { width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: rgba(118,118,128,.24); color: var(--tint); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); touch-action: manipulation; }
  .plus svg { width: 18px; height: 18px; }
  .tb-plus { display: none; position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 4px); pointer-events: none; }
  .topbar[data-v="view-assignments"] .tb-plus, .topbar[data-v="view-attendance"] .tb-plus { display: flex; } .topbar.show .tb-plus { pointer-events: auto; }
  .scrim { position: fixed; inset: 0; z-index: 1100; background: rgba(0,0,0,.45); display: none; opacity: 0; transition: opacity .35s; } .scrim.show { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 1200; display: none; flex-direction: column; max-height: calc(100% - var(--kb, 0px) - 48px);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)), rgba(28,28,30,.8); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
    border-radius: 32px 32px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 -10px 40px rgba(0,0,0,.5); transform: translateY(105%); transition: transform .45s var(--spring); }
  .sheet.show { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(235,235,245,.3); margin: 8px auto 0; flex: none; }
  .sh-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 4px; flex: none; }
  #sh-title, #a-title { font-size: 17px; font-weight: 600; text-transform: lowercase; }
  .sh-bar button { border: 0; background: none; color: var(--tint); font-family: inherit; font-size: 17px; padding: 10px 12px; min-width: 76px; }
  #sh-save { font-weight: 600; text-align: right; } #sh-cancel { text-align: left; } #sh-save:disabled { opacity: .35; }
  .sh-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px calc(env(safe-area-inset-bottom) + 16px); }
  .sheet .group { background: rgba(118,118,128,.22); }
  .frow { position: relative; display: flex; align-items: center; min-height: 52px; padding: 0 16px; gap: 12px; }
  .frow + .frow::before { content: ''; position: absolute; top: 0; left: 16px; right: 16px; height: .5px; background: var(--sep); }
  .frow > label { font-size: 17px; flex: none; }
  .frow input, .frow select { flex: 1; min-width: 0; height: 52px; padding: 0; background: none; border: 0; outline: 0; color: var(--text); font-family: inherit; font-size: 17px; text-align: right; text-align-last: right; -webkit-appearance: none; appearance: none; }
  .frow input::placeholder { color: #636366; } #f-name { text-align: right; text-align-last: right; } #f-type { text-transform: uppercase; }
  .frow input[type=date] { flex: none; height: 36px; margin-left: auto; color-scheme: dark; -webkit-appearance: auto; appearance: auto; }
  .sw { position: relative; margin-left: auto; width: 51px; height: 31px; flex: none; }
  .sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 1; }
  .sw i { position: absolute; inset: 0; border-radius: 16px; background: rgba(120,120,128,.32); transition: background .25s; }
  .sw i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); transition: transform .3s var(--spring); }
  .sw input:checked + i { background: #34C759; } .sw input:checked + i::after { transform: translateX(20px); }
  /* 2.8: wheel = 4/7 width; next up double height; blank-until-chosen date field */
  .lcol { width: 57.1429%; max-width: none; }
  .hero .wheel-pct { font-size: 36px; } .hero .wheel-frac { font-size: 12px; }
  .side { gap: 8px; }
  .tile.big { flex: 2; justify-content: flex-start; padding-top: 10px; }
  .tile.big .tl { margin-bottom: 7px; } .ev + .ev { margin-top: 8px; }
  .ev { width: 100%; min-width: 0; } .ev .tn { margin-top: 0; }
  .tile.wx .wxart { width: 40px; height: 32px; } .tv small { font-size: 11px; }
  .wtxt { min-width: 0; } .wtxt .ts { white-space: normal; line-height: 14px; overflow-wrap: normal; font-size: 11px; letter-spacing: -.1px; }
  .dtxt { margin-left: auto; font-size: 17px; pointer-events: none; }
  .frow input#a-date, .frow input#f-due { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; }
  /* 2.9: grades tab + class overview sheet */
  .gpa { display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 16px 12px; }
  .gv { font-size: 44px; font-weight: 700; letter-spacing: -1px; line-height: 46px; } .gv.sm { font-size: 28px; line-height: 32px; text-align: right; }
  .gpa .r { text-align: right; }
  .task.pad { padding-left: 16px; } .task.static:active { background: none; }
  .gl { font-size: 20px; font-weight: 700; margin-left: 12px; flex: none; }
  .chev { width: 8px; height: 14px; margin-left: 10px; flex: none; color: #48484A; }
  .tname b { font-weight: 600; }
  .dn { position: relative; width: 184px; height: 184px; margin: 6px auto 0; } .dn svg { width: 100%; height: 100%; display: block; }
  .dn .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dn .cl { font-size: 40px; font-weight: 700; line-height: 42px; } .dn .cp { font-size: 15px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .scale { text-align: center; font-size: 12px; color: var(--sub); margin: 12px 8px 0; line-height: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 5px; flex: none; }
  #c-title { font-size: 17px; font-weight: 600; max-width: 56%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #csheet .grp { margin-top: 20px; }
  /* 2.10: grade on the right as "94.44 (A)", tap-to-reveal gpa */
  .gr { font-size: 17px; margin-left: 12px; flex: none; font-variant-numeric: tabular-nums; } .gr i { font-style: normal; color: var(--sub); }
  .gv.eyebox { display: flex; align-items: center; height: 46px; } .eye { display: block; color: var(--sub); }
  /* 2.16 */
  .topbar#topbar { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; box-shadow: none; opacity: 1; transition: none; }
  .topbar#topbar::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .2s; border-bottom: .5px solid var(--sep);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)), rgba(0,0,0,.3); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); }
  .topbar#topbar.show::before { opacity: 1; }
  .topbar#topbar { height: calc(env(safe-area-inset-top) + 68px); padding-top: calc(env(safe-area-inset-top) + 24px); padding-bottom: 0; }
  #tb-title { font-size: 20px; font-weight: 700; letter-spacing: -.2px; opacity: 0; transition: opacity .2s; -webkit-font-smoothing: antialiased; }
  .topbar.show #tb-title { opacity: 1; }
  .fab { display: none; position: fixed; z-index: 900; right: 12px; top: calc(env(safe-area-inset-top) + 20px); width: 44px; height: 44px; border-radius: 22px; border: 0; padding: 0; align-items: center; justify-content: center; color: #fff; touch-action: manipulation;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)), rgba(60,60,64,.45); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 3px 12px rgba(0,0,0,.4); }
  .fab:active { transform: scale(.94); } .fab svg { width: 22px; height: 22px; }
  .topbar[data-v="view-assignments"] ~ .fab, .topbar[data-v="view-attendance"] ~ .fab { display: flex; }
  .seg { padding: 3px; border-radius: 13px; margin-bottom: 8px; }
  .seg i { top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n)); border-radius: 10px; }
  .seg button { font-size: 15px; line-height: 38px; }
  .tile.wx .tv, .tile .tv { font-size: 22px; line-height: 26px; font-weight: 700; }

  <script src="engine.js"></script>
<script>
    // --- TAB SWITCHING ---
    const navBar = document.getElementById('nav-bar');
    const navItems = document.querySelectorAll('.nav-item');
    const views = document.querySelectorAll('.view');
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        navItems.forEach(nav => nav.classList.remove('active'));
        views.forEach(view => view.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(item.getAttribute('data-target')).classList.add('active');
        navBar.style.setProperty('--active-index', item.getAttribute('data-index'));
      });
    });

    // --- WHEEL LOGIC (Migrated from combo.html) ---
    const API = 'https://script.google.com/macros/s/AKfycbyE5xal4egIeVobrupwSZYgtbmTQL781t3pHox0GeEMQCsSQe7T65qXm1P4pBzDonN5/exec';
    const TOKEN = 'e0f91ee8386a7bbb5b69';
    let appData = null;
    let weekOffset = 0;
    
    // Core parameters for SVG Drawing
    const R = 96; const CUTOUT = 0.54; const MAX_THICK = 20; const GAP = 2.5;
    
    const COLORS = {
      'bch351':'#b2e2b6','biochem':'#b2e2b6','bio240':'#9ed2f6','anat+phys':'#9ed2f6',
      'bsc494':'#e4b39b','teaching':'#e4b39b','gn427':'#d3f1bf','bioinformatics':'#d3f1bf',
      'gn521':'#91e3d6','molgen':'#91e3d6','pb421':'#c2c7f8','plant phys':'#c2c7f8',
      'phi325':'#fbe0a3','bioethics':'#fbe0a3','e115':'#e2d5f8','computing':'#e2d5f8'
    };

    let THEME = document.documentElement.getAttribute('data-theme') || 'default';
    const TMAP = {
      light: { '#b2e2b6':'#2FA84F','#9ed2f6':'#2F8FD8','#e4b39b':'#D9714A','#d3f1bf':'#6BB33A','#91e3d6':'#14A89A','#c2c7f8':'#6670D8','#fbe0a3':'#E09A14','#e2d5f8':'#9A62D8','#A6A6B1':'#8E8E93' },
      elegant: { '#b2e2b6':'#426345','#9ed2f6':'#4F7F86','#e4b39b':'#8C5A7A','#d3f1bf':'#5E9A5A','#91e3d6':'#3F7A5C','#c2c7f8':'#6A5A8C','#fbe0a3':'#A0627A','#e2d5f8':'#5E7A56','#A6A6B1':'#7A8478' }
    };
    TMAP.moody = TMAP.elegant;
    function colorFor(name) {
      let n = String(name || '').toLowerCase(), c = '#A6A6B1';
      if (COLORS[n]) c = COLORS[n]; else for (let k in COLORS) if (n.includes(k)) { c = COLORS[k]; break; }
      const m = TMAP[THEME]; return (m && m[c]) || c;
    }
    function applyTheme(t) {
      THEME = t; try { localStorage.setItem('wheel-theme', t); } catch (e) {}
      if (t === 'default') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
      const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = ({ light: '#F2F2F7', elegant: '#E4D9C2', moody: '#111111' })[t] || '#000000';
      drawWheel(false); renderTasks(); renderGrades(); renderAtt(); renderSettings(); renderSide();
    }

    function getWeekRange() {
      let now = new Date(); now.setDate(now.getDate() + (weekOffset * 7));
      let s = new Date(now); s.setDate(now.getDate() - now.getDay()); s.setHours(0,0,0,0);
      let e = new Date(s);   e.setDate(s.getDate() + 6);              e.setHours(23,59,59,999);
      return { s: s.getTime(), e: e.getTime() };
    }

    function updateWeekLabel() {
      if (typeof renderDash === "function") renderDash();
      const lbl = document.getElementById('week-label');
      if (weekOffset === 0) lbl.textContent = 'this week';
      else if (weekOffset === -1) lbl.textContent = 'last week';
      else if (weekOffset === 1) lbl.textContent = 'next week';
      else if (weekOffset > 1) lbl.textContent = `in ${weekOffset} wks`;
      else lbl.textContent = `${Math.abs(weekOffset)} wks ago`;
    }

    let wheelTok = 0;
    function drawWheel(animate = false) {
      updateWeekLabel();
      const svg = document.getElementById('wheel-svg');
      
      if (!appData || !appData.assignments) {
        svg.innerHTML = `<circle cx="100" cy="100" r="${R-9}" fill="none" stroke-width="18" style="stroke:var(--track)"/>`;
        document.getElementById('wheel-pct').textContent = '–';
        document.getElementById('wheel-frac').textContent = 'loading...';
        return;
      }

      const rg = getWeekRange();
      const weekTasks = appData.assignments.filter(a => a.t >= rg.s && a.t <= rg.e);
      const doneTasks = weekTasks.filter(a => a.d);
      
      // Find classes that actually have assignments this week
      const belongs = (c, a) => a.c && c.toLowerCase().includes(String(a.c).toLowerCase());
      const activeCourses = appData.courses.filter(c => weekTasks.some(a => belongs(c, a)));

      let html = '', rings = [];
      if (activeCourses.length === 0) {
        html = `<circle cx="100" cy="100" r="${R-9}" fill="none" stroke-width="18" style="stroke:var(--track)"/>`;
      } else {
        const thick = Math.min(MAX_THICK, (R * (1 - CUTOUT)) / activeCourses.length);
        activeCourses.forEach((c, i) => {
          const mine = weekTasks.filter(a => belongs(c, a));
          const pct = mine.length ? (mine.filter(a => a.d).length / mine.length) : 0;
          const rad = R - (i * thick) - (thick / 2), w = Math.max(thick - GAP, 2);
          html += `<circle cx="100" cy="100" r="${rad}" fill="none" stroke-width="${w}" style="stroke:var(--track)"/>`;
          if (pct > 0) rings.push({ rad, w, pct, col: colorFor(c) });
        });
      }
      // coloured arcs end in a chevron (same shape as the grade summary); drawn as paths so they can animate
      const arcs = f => rings.map(g => {
        const t1 = g.pct * f * 2 * Math.PI; if (t1 <= 0.001) return '';
        if (g.pct >= 0.999 && f >= 0.999) return `<circle cx="100" cy="100" r="${g.rad}" fill="none" stroke="${g.col}" stroke-width="${g.w}"/>`;
        const r1 = g.rad - g.w / 2, r2 = g.rad + g.w / 2, tc = Math.max(t1 - Math.min(.41 * g.w / g.rad, t1 * .6), 0), big = tc > Math.PI ? 1 : 0;
        const P = (r, t) => (100 + r * Math.sin(t)).toFixed(2) + ' ' + (100 - r * Math.cos(t)).toFixed(2);
        return `<path d="M${P(r2, 0)}A${r2} ${r2} 0 ${big} 1 ${P(r2, tc)}L${P(g.rad, t1)}L${P(r1, tc)}A${r1} ${r1} 0 ${big} 0 ${P(r1, 0)}Z" fill="${g.col}"/>`;
      }).join('');
      const tok = ++wheelTok;
      svg.innerHTML = html + '<g id="wg"></g>';
      const wg = svg.querySelector('#wg');
      if (animate && rings.length) {
        const t0 = performance.now();
        const step = now => { if (tok !== wheelTok) return; const q = Math.min((now - t0) / 800, 1); wg.innerHTML = arcs(1 - Math.pow(1 - q, 4)); if (q < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      } else wg.innerHTML = arcs(1);
      document.getElementById('wheel-pct').textContent = weekTasks.length ? Math.round((doneTasks.length / weekTasks.length) * 100) + '%' : '0%';
      document.getElementById('wheel-frac').textContent = `${doneTasks.length}/${weekTasks.length} done`;
    }

    function fetchData(silent) {
      if (DEMO) { if (!silent) { appData = demoData(); synced(); } return Promise.resolve(); }
      if (fetching) return Promise.resolve(); fetching = true;
      return fetch(`${API}?token=${encodeURIComponent(TOKEN)}`)
        .then(res => res.json())
        .then(data => {
          fetching = false;
          if (data.error) throw new Error(data.error);
          if (EVT) { data.events = EVT.events; data.calendars = EVT.calendars; }
          applyOv(data); stash = data; saveCache(data);
          document.getElementById('error-msg').style.display = 'none';
          flushStash();
          loadEvents();
        })
        .catch(err => {
          fetching = false; console.error(err);
          if (silent && appData) return;
          document.getElementById('wheel-frac').textContent = 'error';
          const errBox = document.getElementById('error-msg');
          errBox.textContent = "Failed to connect to Google Sheets.";
          errBox.style.display = 'block';
        });
    }
    let fetching = false, stash = null;
    let EVT = null; try { EVT = JSON.parse(localStorage.getItem('wheel-ev') || 'null'); } catch (e) {}
    let evFetching = false;
    // calendar comes from its own (cached) request so a slow calendar never holds up the sheet
    function loadEvents(fresh) {
      if (DEMO || evFetching) return; evFetching = true;
      fetch(`${API}?token=${encodeURIComponent(TOKEN)}&part=events${fresh ? '&fresh=1' : ''}`).then(r => r.json()).then(r => {
        evFetching = false; if (!r || r.error || !r.events) return;
        EVT = { events: r.events, calendars: r.calendars }; try { localStorage.setItem('wheel-ev', JSON.stringify(EVT)); } catch (e) {}
        if (appData) { appData.events = r.events; appData.calendars = r.calendars; saveCache(); try { renderDash(); renderSide(); } catch (e) {} }
      }).catch(() => { evFetching = false; });
    }
    let RESUME = null;
    function smoothReload() {
      try { localStorage.setItem('wheel-resume', JSON.stringify({ v: scrollView, s: $('scroll-container').scrollTop, f: filter, p: scrollPos, t: Date.now() })); } catch (e) {}
      document.body.style.transition = 'opacity .22s ease'; document.body.style.opacity = '0';
      setTimeout(() => location.reload(), 230);
    }
    // fetch the newest app.html straight from the server; if its build differs from ours, reload into it
    function checkUpdate() {
      if (DEMO || !/github\.io$/.test(location.hostname)) return Promise.resolve(false);
      return fetch(location.origin + location.pathname + '?v=' + Date.now(), { cache: 'reload' }).then(r => r.text()).then(t => {
        const m = /const BUILD = '([a-z]?\d[^']*)'/.exec(t);
        if (m && m[1] !== BUILD && !busy()) { smoothReload(); return true; }
        return false;
      }).catch(() => false);
    }
    // pull down at the top of any tab to refresh
    (function () {
      const sc = document.getElementById('scroll-container'), ind = document.getElementById('ptr'); let y0 = null, pull = 0, busyP = false;
      const view = () => document.querySelector('.view.active');
      const set = (px, anim) => { const v = view(); if (v) { v.style.transition = anim ? 'transform .3s var(--spring)' : 'none'; v.style.transform = px ? 'translateY(' + px + 'px)' : ''; }
        ind.style.transition = anim ? 'opacity .25s, transform .3s var(--spring)' : 'none'; ind.style.opacity = Math.min(px / 50, 1); ind.style.transform = 'translate(-50%,' + (px * .5 - 7) + 'px) rotate(' + (px * 4) + 'deg)'; };
      sc.addEventListener('touchstart', e => { y0 = (!busyP && sc.scrollTop <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null; pull = 0; }, { passive: true });
      sc.addEventListener('touchmove', e => {
        if (y0 === null) return; const dy = e.touches[0].clientY - y0;
        if (dy <= 0 || sc.scrollTop > 0) { if (pull) set(pull = 0, true); return; }
        if (e.cancelable) e.preventDefault(); pull = Math.min(dy * .5, 90); set(pull);
      }, { passive: false });
      sc.addEventListener('touchend', () => {
        if (y0 === null) return; y0 = null;
        if (pull < 60) { set(pull = 0, true); return; }
        busyP = true; set(56, true); ind.classList.add('spin');
        Promise.all([checkUpdate(), fetchData(false), DEMO ? new Promise(r => setTimeout(r, 700)) : Promise.resolve(), (loadWx(), Promise.resolve())])
          .catch(() => {}).then(() => { setTimeout(() => { ind.classList.remove('spin'); set(pull = 0, true); busyP = false; }, 250); });
      }, { passive: true });
    })();
    function busy() {
      const ae = document.activeElement, ed = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
      return !!(pending || hold || ed || ['sheet', 'csheet', 'asheet'].some(id => $(id).classList.contains('show')));
    }
    function flushStash() {
      if (!stash) return;
      if (busy()) { setTimeout(flushStash, 2000); return; }
      applyOv(stash); appData = stash; stash = null; synced();
    }
    function saveCache(d) { try { localStorage.setItem('wheel-cache', JSON.stringify({ ts: Date.now(), data: d || appData })); } catch (e) {} }

    // Local changes stay on screen until the sheet shows the same thing (or 90 s pass), so a slow save never makes things pop back.
    const OV = {}, gradeHold = new Set(), DEL = {};   // DEL: deleted here, hidden until the sheet agrees (90 s)
    const kOf = a => a.c + '|' + a.n + '|' + a.t;
    const snapOf = a => ({ r: a.r, n: a.n, c: a.c, y: a.y, t: a.t, d: a.d, g: a.g });
    function setOv(key, base, fields, add) {
      const o = OV[key] || (OV[key] = { base: base, f: {}, add: !!add });
      Object.assign(o.f, fields); o.exp = Date.now() + 90000;
    }
    const same = (x, y) => String(x == null ? '' : x) === String(y == null ? '' : y);
    function applyOv(data) {
      const now = Date.now(); if (data.assignments) data.assignments = data.assignments.filter(x => !(DEL[kOf(x)] > now));
      const L = data.assignments || [];
      Object.keys(OV).forEach(k => {
        const o = OV[k]; if (now > o.exp) { delete OV[k]; return; }
        const nk = kOf(Object.assign({}, o.base, o.f));
        if (L.some(x => kOf(x) === nk && Object.keys(o.f).every(p => same(x[p], o.f[p])))) { delete OV[k]; return; }   // sheet caught up
        const old = L.find(x => kOf(x) === k);
        if (old) Object.assign(old, o.f); else if (o.add) L.push(Object.assign({}, o.base, o.f));
      });
    }

    // Week Nav Listeners
    document.getElementById('btn-prev').addEventListener('click', (e) => { e.preventDefault(); weekOffset--; drawWheel(true); });
    document.getElementById('btn-next').addEventListener('click', (e) => { e.preventDefault(); weekOffset++; drawWheel(true); });

    const BUILD = 'm2.45 (11/03 11:26am)';
    const DEMO = /[?&]demo/.test(location.search) || !/github\.io$/.test(location.hostname);

    let filter = 'upcoming', lastSync = null, pending = null, hold = false;
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const DAYS = ['sun','mon','tue','wed','thu','fri','sat'], MONS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const dayLabel = ms => { const d = new Date(ms); return DAYS[d.getDay()] + ' ' + MONS[d.getMonth()] + ' ' + d.getDate(); };
    const CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#1C1C1E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    // --- EDIT / ADD / GRADE SHEET ---
    let editing = null, shT = null;
    const p2 = n => String(n).padStart(2, '0');
    const toStr = ms => { const d = new Date(ms); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
    const toMs = str => { const q = str.split('-'); return new Date(q[0], q[1] - 1, q[2]).getTime(); };
    const dueTxt = ms => { const y = new Date(ms).getFullYear(); return dayLabel(ms) + (y !== new Date().getFullYear() ? ' ' + y : ''); };
    function updDue() { const v = $('f-due').value; $('f-due-txt').textContent = v ? dueTxt(toMs(v)) : ''; }
    function formOk() { $('sh-save').disabled = !($('f-name').value.trim() && $('f-class').value && $('f-due').value); }
    function openSheet(a) {
      if (!appData || !appData.assignments) return;
      editing = a || null;
      const names = {};
      (appData.courses || []).forEach(c => { const w = String(c).split(' '); names[w[0]] = String(c); });
      appData.assignments.forEach(x => { if (x.c && !names[x.c]) names[x.c] = x.c; });
      $('f-class').innerHTML = '<option value=""></option>' + Object.keys(names).sort().map(k => `<option value="${esc(k)}">${esc(names[k])}</option>`).join('');
      $('sh-title').textContent = a ? 'edit assignment' : 'new assignment'; $('sh-save').textContent = a ? 'save' : 'add';
      $('f-name').value = a ? a.n : ''; $('f-class').value = a ? a.c : ''; $('f-type').value = a ? (a.y || '') : '';
      $('f-due').value = a ? toStr(a.t) : ''; updDue(); $('f-grade').value = a && a.g != null && a.g !== '' ? fmtG(a.g) : ''; $('f-done').checked = a ? !!a.d : false;
      formOk(); clearTimeout(shT);
      $('scrim').style.display = 'block'; $('sheet').style.display = 'flex'; void $('sheet').offsetHeight;
      $('scrim').classList.add('show'); $('sheet').classList.add('show');
      if (!a) $('f-name').focus(); else if (filter === 'grade') $('f-grade').focus();
    }
    function closeSheet() {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      $('sheet').style.transform = ''; $('sheet').classList.remove('show'); $('scrim').classList.remove('show');
      shT = setTimeout(() => { $('sheet').style.display = 'none'; $('scrim').style.display = 'none'; }, 460);
    }
    function saveSheet() {
      if ($('sh-save').disabled) return;
      if (pending) commit(pending);
      const g = $('f-grade').value.trim(), gn = g === '' ? null : (isNaN(Number(g)) ? g : Number(g));
      const vals = { n: $('f-name').value.trim(), c: $('f-class').value, y: $('f-type').value.trim().toUpperCase(), t: toMs($('f-due').value), d: $('f-done').checked, g: gn };
      const a = editing, snap = a ? Object.assign({}, a) : null; let item = a;
      const k0 = a ? kOf(a) : null;
      if (a) { Object.assign(a, vals); setOv(k0, snapOf(snap), vals); } else { item = Object.assign({ r: Math.max(2, ...appData.assignments.map(x => x.r)) + 1 }, vals); appData.assignments.push(item); setOv(kOf(item), snapOf(item), {}, true); }
      saveCache();
      closeSheet(); renderTasks(); renderDash(); drawWheel(false);
      showUndo(a ? 'saved' : 'added', false); setTimeout(hideUndo, 1800);
      if (DEMO) return;
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, redirect: 'follow', body: JSON.stringify({ token: TOKEN, action: a ? 'edit' : 'add', row: a ? snap.r : null, match: snap ? { n: snap.n, c: snap.c } : null,
        fields: { done: vals.d, due: $('f-due').value, name: vals.n, className: vals.c, type: vals.y, grade: gn == null ? '' : gn } }) })
        .then(r => r.json()).then(j => { if (!j || !j.ok) throw new Error('save failed'); if (!a && j.row) item.r = j.row; })
        .catch(() => {
          if (a) { Object.keys(a).forEach(k => delete a[k]); Object.assign(a, snap); delete OV[k0]; } else { appData.assignments.splice(appData.assignments.indexOf(item), 1); delete OV[kOf(item)]; }
          saveCache();
          renderTasks(); renderDash(); drawWheel(false); showUndo('couldn’t save — try again', false); setTimeout(hideUndo, 3500);
        });
    }
    $('fab').addEventListener('click', () => $('topbar').dataset.v === 'view-attendance' ? openAbs(null) : openSheet(null));
    $('sh-cancel').addEventListener('click', closeSheet); $('scrim').addEventListener('click', () => $('asheet').classList.contains('show') ? closeAbs() : $('csheet').classList.contains('show') ? closeClass() : closeSheet()); $('sh-save').addEventListener('click', saveSheet);
    ['f-name', 'f-class', 'f-due'].forEach(id => { $(id).addEventListener('input', formOk); $(id).addEventListener('change', formOk); });
    $('f-due').addEventListener('input', updDue); $('f-due').addEventListener('change', updDue);
    $('task-list').addEventListener('change', e => { const i = e.target.closest('.gin'); if (!i) return; const a = rowOf(i); if (a) setGrade(a, i.value, i); });
    $('task-list').addEventListener('click', e => { const b = e.target.closest('.g100'); if (!b) return; const a = rowOf(b), i = b.previousElementSibling; if (a && i) { i.value = '100'; setGrade(a, '100', i); } });
    $('task-list').addEventListener('click', e => {
      if (e.target.closest('.chk, .gin, .g100')) return;
      const row = e.target.closest('.task'); if (!row || !appData) return;
      const a = appData.assignments.find(x => String(x.r) === row.dataset.r && x.n === row.dataset.n && x.c === row.dataset.c);
      if (a) openSheet(a);
    });
    // swipe the sheet down to dismiss; lift it above the keyboard
    (function () {
      const sh = $('sheet'); let y0 = null, dy = 0;
      sh.addEventListener('touchstart', e => { if (e.target.closest('.sh-body')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
      sh.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = 'translateY(' + dy + 'px)'; }, { passive: true });
      sh.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; });
      if (window.visualViewport) {
        const f = () => { sh.style.setProperty('--vvh', visualViewport.height + 'px'); sh.style.setProperty('--kb', Math.max(0, window.innerHeight - visualViewport.height - visualViewport.offsetTop) + 'px'); };
        f(); visualViewport.addEventListener('resize', f); visualViewport.addEventListener('scroll', f);
      }
    })();

    // --- ATTENDANCE TAB (2.12) ---
    function renderAtt() {
      const box = $('att-box'), at = appData && appData.attendance;
      if (!at) { box.innerHTML = '<div class="empty">' + (appData ? 'attendance isn’t connected yet' : 'loading…') + '</div>'; return; }
      const nm = {}; ((appData.grades && appData.grades.courses) || []).forEach(c => nm[c.code] = cname(c));
      box.innerHTML = '<div class="group">' + at.map(a => `<div class="task pad" data-ac="${esc(a.code)}"><div class="tmain"><div class="tname"><b style="color:${colorFor(a.code)}">${esc(a.code)}</b> ${esc(nm[a.code] || '')}</div>` +
        `<div class="tsub">${esc(a.rule || '')}</div></div><span class="tg">${a.dates.length}</span>${CHEV}</div>`).join('') + '</div>';
    }
    let attCode = null;
    function openAtt(code) {
      const a = appData.attendance.find(x => x.code === code); if (!a) return; attCode = code;
      const col = colorFor(code), nm = ((appData.grades && appData.grades.courses) || []).find(c => c.code === code);
      const ds = a.dates.slice().sort((x, y) => y - x);
      $('c-title').textContent = code + (nm ? ' ' + cname(nm) : '');
      $('c-body').innerHTML = `<div class="abig" style="color:${col}">${ds.length}</div><div class="asub">${ds.length === 1 ? 'absence' : 'absences'}</div>` +
        (a.rule ? `<div class="grp">policy</div><div class="group"><div class="task pad static"><div class="tmain"><div class="tname" style="font-weight:400">${esc(a.rule)}</div></div></div></div>` : '') +
        '<div class="grp">dates</div><div class="group">' + (ds.length ? ds.map(t => `<div class="task pad static"><div class="tmain"><div class="tname">${esc(dueTxt(t))}</div></div><button class="rm" data-t="${t}">remove</button></div>`).join('') : '<div class="empty-row">no absences</div>') +
        '</div><div class="group" style="margin-top:20px"><div class="task pad" id="a-add-here"><div class="tmain"><div class="tname" style="color:var(--tint)">add absence</div></div></div></div>';
      $('c-body').scrollTop = 0; clearTimeout(csT);
      $('scrim').style.display = 'block'; $('csheet').style.display = 'flex'; void $('csheet').offsetHeight;
      $('scrim').classList.add('show'); $('csheet').classList.add('show');
    }
    function postAbs(op, code, ds) {
      if (DEMO) return Promise.resolve();
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, redirect: 'follow', body: JSON.stringify({ token: TOKEN, action: op === 'add' ? 'absence_add' : 'absence_remove', className: code, date: ds }) })
        .then(r => r.json()).then(j => { if (!j || !j.ok) throw new Error('save failed'); });
    }
    const csOpen = () => $('csheet').classList.contains('show') && $('c-title').textContent.indexOf(attCode) === 0 && attCode;
    function failAbs(fn) { fn(); renderAtt(); showUndo('couldn’t save — try again', false); setTimeout(hideUndo, 3500); }
    function addAbs(code, ds) {
      const a = appData.attendance.find(x => x.code === code), t = toMs(ds);
      if (!a) return;
      if (a.dates.includes(t)) { showUndo('already logged', false); setTimeout(hideUndo, 1800); return; }
      a.dates.push(t); renderAtt(); showUndo('absence added', false); setTimeout(hideUndo, 1800);
      if (csOpen() === code) openAtt(code);
      postAbs('add', code, ds).catch(() => failAbs(() => { a.dates.splice(a.dates.indexOf(t), 1); if (csOpen() === code) openAtt(code); }));
    }
    function removeAbs(code, t) {
      const a = appData.attendance.find(x => x.code === code); if (!a) return;
      a.dates.splice(a.dates.indexOf(t), 1); renderAtt(); openAtt(code);
      showUndo('absence removed', false); setTimeout(hideUndo, 1800);
      postAbs('remove', code, toStr(t)).catch(() => failAbs(() => { a.dates.push(t); if (csOpen() === code) openAtt(code); }));
    }
    let asT = null;
    function updAdate() { const v = $('a-date').value; $('a-date-txt').textContent = v ? dueTxt(toMs(v)) : ''; }
    function aOk() { $('a-save').disabled = !($('a-class').value && $('a-date').value); }
    function openAbs(code) {
      if (!appData || !appData.attendance) return;
      $('a-class').innerHTML = '<option value=""></option>' + appData.attendance.map(a => { const g = ((appData.grades && appData.grades.courses) || []).find(c => c.code === a.code); return `<option value="${esc(a.code)}">${esc(a.code + (g ? ' ' + cname(g) : ''))}</option>`; }).join('');
      $('a-class').value = code || ''; $('a-date').value = toStr(Date.now()); updAdate(); aOk(); clearTimeout(asT);
      $('scrim').style.zIndex = '1250'; $('scrim').style.display = 'block'; $('asheet').style.display = 'flex'; void $('asheet').offsetHeight;
      $('scrim').classList.add('show'); $('asheet').classList.add('show');
    }
    function closeAbs() {
      $('asheet').style.transform = ''; $('asheet').classList.remove('show');
      if (!$('csheet').classList.contains('show')) $('scrim').classList.remove('show');
      asT = setTimeout(() => { $('asheet').style.display = 'none'; $('scrim').style.zIndex = ''; if (!$('scrim').classList.contains('show')) $('scrim').style.display = 'none'; }, 460);
    }
    $('att-box').addEventListener('click', e => { const r = e.target.closest('[data-ac]'); if (r) openAtt(r.dataset.ac); });
    $('c-body').addEventListener('click', e => {
      const b = e.target.closest('.rm'); if (b) { removeAbs(attCode, Number(b.dataset.t)); return; }
      if (e.target.closest('#a-add-here')) openAbs(attCode);
    });
    $('a-cancel').addEventListener('click', closeAbs);
    $('a-save').addEventListener('click', () => { if ($('a-save').disabled) return; const c = $('a-class').value, d = $('a-date').value; closeAbs(); addAbs(c, d); });
    ['input', 'change'].forEach(ev => { $('a-class').addEventListener(ev, aOk); $('a-date').addEventListener(ev, () => { updAdate(); aOk(); }); });
    (function () {
      const sh = $('asheet'); let y0 = null, dy = 0;
      sh.addEventListener('touchstart', e => { if (e.target.closest('.sh-body')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
      sh.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = 'translateY(' + dy + 'px)'; }, { passive: true });
      sh.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sh.style.transition = ''; if (dy > 110) closeAbs(); else sh.style.transform = ''; });
    })();

    // Live refresh: clock bits every 30 s, sheet every 60 s, weather every 10 min (only while the app is open on screen)
    if (!DEMO) {
      setInterval(() => { if (!document.hidden) { setGreeting(); renderSide(); } }, 30000);
      setInterval(() => { if (!document.hidden) fetchData(true); }, 30000);
      setInterval(() => { if (!document.hidden) loadWx(); }, 600000);
      window.addEventListener('online', () => fetchData(true));
    } else { setInterval(() => { setGreeting(); renderSide(); }, 30000); }
    // Init
    try { const rs = JSON.parse(localStorage.getItem('wheel-resume') || 'null'); localStorage.removeItem('wheel-resume');
      if (rs && Date.now() - rs.t < 20000) {
        RESUME = rs; filter = rs.f || 'upcoming'; Object.assign(scrollPos, rs.p || {});
        document.body.style.opacity = '0'; setTimeout(() => { document.body.style.transition = 'opacity .3s ease'; document.body.style.opacity = ''; }, 1800);
        const it = document.querySelector('.nav-item[data-target="' + rs.v + '"]'); if (it && rs.v !== 'view-dashboard') it.click();
      } } catch (e) {}
    setGreeting(); drawWheel(); // draw empty skeleton immediately
    renderTasks(); renderGrades(); renderAtt(); renderSettings(); renderSide();
    if (!DEMO) { try { const c = JSON.parse(localStorage.getItem('wheel-cache') || 'null'); if (c && c.data && c.data.assignments) { appData = c.data; synced(); } } catch (e) {} }
    fetchData(); // load data
  </script>
</body>
</html>
