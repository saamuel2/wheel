<script>
'use strict';
const BUILD = 'd1.11 (11/03 11:05am)';
// ===================== connection =====================
const API = 'https://script.google.com/macros/s/AKfycbyE5xal4egIeVobrupwSZYgtbmTQL781t3pHox0GeEMQCsSQe7T65qXm1P4pBzDonN5/exec';

const DEMO = /[?&]demo/.test(location.search) || !/github\.io$/.test(location.hostname);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let KEY = store.get('wheel-token', '');
let SEM_START = new Date(2026, 7, 16).getTime();   // Sunday of week 1, same as the phone (classes began Wed Aug 19, 2026)

// ===================== helpers =====================

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'], MONS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const D0 = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };

const ymd = ms => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fromYmd = s => { const p = String(s).split('-'); return new Date(+p[0], p[1] - 1, +p[2]).getTime(); };
const weekStart = ms => { const d = new Date(D0(ms)); d.setDate(d.getDate() - d.getDay()); return d.getTime(); };

const weekTitle = ws => { const n = weekNo(ws); return (n < 1 ? 'before the semester' : 'week ' + n) + ' (' + md(ws) + ' – ' + md(addDays(ws, 6)) + ')'; };

let CALS = store.get('wheel-cals', {});
function calList() {
  if (DEMO) return [{ name: 'sjstrimp@ncsu.edu', col: '#4F8EF7', sel: true }, { name: 'RA', col: '#34A853', sel: true }, { name: 'Classes', col: '#9B6BD3', sel: true }, { name: 'US holidays', col: '#E67C73', sel: false }];
  const a = data && data.calendars; if (a && a.length) return a;
  const m = {}, out = []; ((data && data.events) || []).forEach(e => { if (e.cal && !m[e.cal]) { m[e.cal] = 1; out.push({ name: e.cal, col: e.col, sel: true }); } }); return out;
}
const calOn = name => { if (name == null || name === '') return true; if (name in CALS) return !!CALS[name]; const c = calList().find(x => x.name === name); return !c || c.sel !== false; };
function shownEv() { const seen = {}; return ((data && data.events) || []).filter(e => { if (!calOn(e.cal)) return false; const k = e.n + '|' + e.t; if (seen[k]) return false; seen[k] = 1; return true; }); }
const fmtT = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase();
const same = (x, y) => String(x == null ? '' : x) === String(y == null ? '' : y);
const CHECK = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="var(--chkc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const CAL = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
const EYE_OPEN = '<svg viewBox="1 5 22 14" width="22" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>';

const CD = Object.assign({ mode: 'ldoc', ldoc: '2026-12-08', title: '', date: '' }, store.get('wheel-cd', {}));   // same countdown settings as the phone
const saveCD = () => store.set('wheel-cd', CD);
const EXTRA = ['wv'];   // wolf village: on the sheet, never graded
const blankCls = c => /^\W*$/.test(String(c || '').replace(/[‎‏\s]/g, ''));
const isExtra = c => EXTRA.includes(String(c || '').toLowerCase()) || blankCls(c);
const bigType = y => /^(EX|PR|ES)/i.test(String(y || ''));   // exams, projects and essays stand out, like on the sheet

const COLORS = { bch351: '#b2e2b6', bio240: '#9ed2f6', bsc494: '#e4b39b', gn427: '#d3f1bf', gn521: '#91e3d6', pb421: '#c2c7f8', phi325: '#fbe0a3', e115: '#e2d5f8', wv: '#A6A6B1', lab: '#A6A6B1', hc: '#A6A6B1' };
const SPARE = ['#b2e2b6', '#9ed2f6', '#e4b39b', '#d3f1bf', '#91e3d6', '#c2c7f8', '#fbe0a3', '#e2d5f8', '#f6b8c9', '#bfe6ef'];
const TMAP = {
  light: { '#b2e2b6': '#2FA84F', '#9ed2f6': '#2F8FD8', '#e4b39b': '#D9714A', '#d3f1bf': '#6BB33A', '#91e3d6': '#14A89A', '#c2c7f8': '#6670D8', '#fbe0a3': '#E09A14', '#e2d5f8': '#9A62D8', '#A6A6B1': '#8E8E93', '#f6b8c9': '#D9577D', '#bfe6ef': '#2C9DB5' },
  elegant: { '#b2e2b6': '#426345', '#9ed2f6': '#4F7F86', '#e4b39b': '#8C5A7A', '#d3f1bf': '#5E9A5A', '#91e3d6': '#3F7A5C', '#c2c7f8': '#6A5A8C', '#fbe0a3': '#A0627A', '#e2d5f8': '#5E7A56', '#A6A6B1': '#7A8478', '#f6b8c9': '#9A4E62', '#bfe6ef': '#4A7480' }
};
TMAP.moody = TMAP.elegant;
let THEME = document.documentElement.getAttribute('data-theme') || 'default';
function colorFor(code) {
  const k = String(code || '').toLowerCase().replace(/\s+/g, '');
  let c = COLORS[k];
  if (!c) { let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0; c = SPARE[h % SPARE.length]; }
  const m = TMAP[THEME]; return (m && m[c]) || c;
}
const spaceCode = c => String(c || '').replace(/^([a-z]+)(\d+)$/i, (m, a, b) => a.toUpperCase() + ' ' + b);

// ===================== data =====================
let data = null, lastSync = 0, syncState = 'busy', fetching = false, pendingData = null;
const OV = {};                                // local edits stay on screen until the sheet shows them (or 90 s pass)
const kOf = a => a.c + '|' + a.n + '|' + a.t;
function setOv(base, fields, add) { const k = kOf(base), o = OV[k] || (OV[k] = { base: Object.assign({}, base), f: {}, add: !!add }); Object.assign(o.f, fields); o.exp = Date.now() + 90000; }
const DEL = {};   // deleted here; hidden until the sheet agrees (90 s)
function applyOv(d) {
  const now = Date.now(); if (d.assignments) d.assignments = d.assignments.filter(x => !(DEL[kOf(x)] > now));
  const L = d.assignments || [];
  Object.keys(OV).forEach(k => {
    const o = OV[k]; if (now > o.exp) { delete OV[k]; return; }
    const cur = L.find(x => kOf(x) === kOf(Object.assign({}, o.base, o.f))) || L.find(x => kOf(x) === k);
    if (cur && Object.keys(o.f).every(p => same(cur[p], o.f[p]))) { delete OV[k]; return; }
    if (cur) Object.assign(cur, o.f); else if (o.add) L.push(Object.assign({}, o.base, o.f));
  });
}
const editing = () => { const a = document.activeElement; return !!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); };

function load(silent) {
  if (DEMO) { if (!data) { data = demoData(); lastSync = Date.now(); setSync('ok'); renderAll(); } return Promise.resolve(); }
  if (!KEY) { setSync('off', 'not connected'); renderAll(); return Promise.resolve(); }
  if (fetching) return Promise.resolve(); fetching = true; if (!silent) setSync('busy');
  return fetch(API + '?token=' + encodeURIComponent(KEY)).then(r => r.json()).then(d => {
    fetching = false;
    if (d.error) { setSync('off', d.error === 'bad token' ? 'wrong connection key' : d.error); if (d.error === 'bad token') { data = null; renderAll(); } return; }
    if (EVT) { d.events = EVT.events; d.calendars = EVT.calendars; }
    applyOv(d); lastSync = Date.now(); setSync('ok'); loadEvents();
    if (editing() || $('drawer').classList.contains('on')) { pendingData = d; return; }
    setData(d);
  }).catch(() => { fetching = false; setSync('off', 'offline — showing last copy'); });
}
let EVT = store.get('desk-ev', null), evFetching = false;
function loadEvents(fresh) {
  if (DEMO || !KEY || evFetching) return; evFetching = true;
  fetch(API + '?token=' + encodeURIComponent(KEY) + '&part=events' + (fresh ? '&fresh=1' : '')).then(r => r.json()).then(r => {
    evFetching = false; if (!r || r.error || !r.events) return;
    EVT = { events: r.events, calendars: r.calendars }; store.set('desk-ev', EVT);
    if (data) { data.events = r.events; data.calendars = r.calendars; if (!editing()) { try { renderAll(); } catch (e) {} } }
  }).catch(() => { evFetching = false; });
}
function setData(d) { data = d; LIVE = null; store.set('desk-cache', d); renderAll(); }
setInterval(() => { if (pendingData && !editing() && !$('drawer').classList.contains('on')) { const d = pendingData; pendingData = null; applyOv(d); setData(d); } }, 1500);
function setSync(s, msg) {
  syncState = s; const el = $('sync'); el.className = 'sync' + (s === 'off' ? ' off' : s === 'busy' ? ' busy' : '');
  el.querySelector('span').textContent = msg || (s === 'busy' ? 'syncing…' : s === 'ok' ? (DEMO ? 'demo data' : 'synced ' + fmtT(lastSync)) : 'offline');

function post(body) {
  if (DEMO) return Promise.resolve({ ok: true, id: 'demo' + Date.now() });

const cached = store.get('desk-cache', null);
if (!DEMO && cached && KEY) data = cached;

// ===================== new version → reload into it, keeping the view and scroll (like the phone) =====================
function smoothReload() {
  store.set('desk-resume', { v: VIEW, s: $('main').scrollTop, t: Date.now() });

}
function checkUpdate() {

// ===================== events =====================
function startAdd(after) {
  const d = newDraft(after);
  if (VIEW !== 'sheet') go('sheet'); else renderAll();
  if (after == null) $('main').scrollTop = 0;
  setTimeout(() => { const n = document.querySelector(`[data-draft="${d.id}"][data-df="n"]`); if (n) { n.focus(); if (after != null) n.scrollIntoView({ block: 'center' }); } }, 30);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-view]'); if (!t) return;
  const act = t.dataset.act;
  if (!act && t.dataset.view) return go(t.dataset.view);
  const holder = t.closest('[data-i]');
  switch (act) {
    case 'go': return go(t.dataset.view);
    case 'del': { const a = byIdx(holder && holder.dataset.i); if (a) deleteAssignment(a); return; }
    case 'done': { const a = byIdx(t.dataset.i != null ? t.dataset.i : holder && holder.dataset.i); if (a) toggleDone(a); return; }
    case 'wk-': weekOff--; return renderAll();
    case 'wk+': weekOff++; return renderAll();
    case 'wk0': weekOff = 0; return renderAll();
    case 'eye': showGrades = !showGrades; return renderAll();
    case 'cdedit': cdEdit = !cdEdit; return renderAll();
    case 'gpa': if (e.target.closest('a,button:not(.gpa)') && e.target.closest('[data-act]') !== t) return; showGpa = !showGpa; return renderAll();
    case 'course': if (VIEW === 'dash' && !showGrades) return; return openCourse(t.dataset.code);
    case 'close': return closeDrawer();
    case 'upcoming': return openUpcoming();
    case 'calchip': return toggleCal(t.dataset.cal);
    case 'add': return startAdd();
    case 'sf': STAY.clear(); TEST = {}; SF.f = t.dataset.f; SF.sort = 'due'; SF.dir = 1; saveSF(); return renderAll();
    case 'scls': { STAY.clear(); const c = t.dataset.c, i = SF.cls.indexOf(c); if (i > -1) SF.cls.splice(i, 1); else SF.cls.push(c); SF.sort = 'due'; SF.dir = 1; saveSF(); return renderAll(); }
    case 'insert': return startAdd(+t.dataset.i);
    case 'draft-ok': return saveDraft(+t.dataset.draft);
    case 'draft-x': DRAFTS = DRAFTS.filter(d => d.id !== +t.dataset.draft); return renderAll();
    case 'sort': { STAY.clear(); const s = t.dataset.s; if (SF.sort === s) SF.dir = -SF.dir; else { SF.sort = s; SF.dir = 1; } saveSF(); return renderAll(); }
    case 'outof': SF.out = !SF.out; saveSF(); return renderAll();
    case 'wi-reset': return openCourse(WI.code);
    case 'abs-add': { const code = t.dataset.code, d = $('abs-' + code).value; if (!d) return; const x = data.attendance.find(y => y.code === code), ms = fromYmd(d); if (x.dates.some(z => D0(z) === ms)) return; x.dates.push(ms); changed();
      post({ action: 'absence_add', className: code, date: d }).catch(() => { x.dates.splice(x.dates.indexOf(ms), 1); changed(); toast('couldn’t save — try again'); }); return; }
    case 'abs-rm': { const code = t.dataset.code, d = t.dataset.d, x = data.attendance.find(y => y.code === code), i = x.dates.findIndex(z => D0(z) === fromYmd(d)); if (i < 0) return; const ms = x.dates.splice(i, 1)[0]; changed();
      post({ action: 'absence_remove', className: code, date: d }).catch(() => { x.dates.push(ms); changed(); toast('couldn’t save — try again'); }); return; }
    case 'ra': { const x = (data.ra || []).find(y => String(y.r) === t.dataset.r && y.n === t.dataset.n); if (!x) return;
      return checkOff(x, () => post({ action: 'ra_done', row: x.r, n: x.n, done: x.d }), x.d ? 'done: ' + x.n : 'reopened ' + x.n); }
    case 'radone': showRaDone = !showRaDone; return renderAll();
    case 'todo': { const x = (data.todo || []).find(y => y.id === t.dataset.id); if (!x) return;
      return checkOff(x, () => post({ action: 'task_done', id: x.id, done: x.d }), 'done: ' + x.n); }
    case 'theme': THEME = t.dataset.t; try { localStorage.setItem('wheel-theme', THEME); } catch (x) {} if (THEME === 'default') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME); return renderAll();
    case 'savekey': { KEY = $('key-in').value.trim(); store.set('wheel-token', KEY); data = null; LIVE = null; return load(); }
    case 'sync': return load();
    case 'pick': { const inp = t.parentNode.querySelector('input[type=date]'); if (inp) { try { inp.showPicker(); } catch (x) { inp.focus(); inp.click(); } } return; }
  }
});
// tick it → it leaves the list right away; undo within a few seconds puts it back before anything is saved
function checkOff(x, save, msg) {
  x.d = !x.d; renderAll();
  let undone = false;
  const tm = setTimeout(() => { if (undone) return; save().catch(() => { x.d = !x.d; renderAll(); toast('couldn’t save — try again'); }); }, 3500);
  toast(msg, () => { undone = true; clearTimeout(tm); x.d = !x.d; renderAll(); });
}
function addTodo() {
  const inp = $('td-new'), title = inp && inp.value.trim(); if (!title) return;
  const due = $('td-due').value, x = { id: 'tmp' + Date.now(), n: title, d: false, t: due ? fromYmd(due) : null };
  data.todo.push(x); if (data._todoOrder) data._todoOrder.push(x.id); inp.value = ''; renderAll(); setTimeout(() => $('td-new') && $('td-new').focus(), 0);
  post({ action: 'task_add', title, due }).then(j => { const old = x.id; x.id = j.id || x.id; if (data._todoOrder) data._todoOrder[data._todoOrder.indexOf(old)] = x.id; }).catch(() => { data.todo.splice(data.todo.indexOf(x), 1); renderAll(); toast('couldn’t add — try again'); });
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'sq') { SF.q = t.value; saveSF(); renderAll(); return; }
  if (t.dataset.draft && t.dataset.df) { const d = DRAFTS.find(x => x.id === +t.dataset.draft); if (d) d.f[t.dataset.df] = t.value; return; }
  if (t.dataset.gr === 'name') { GR.name = t.value; store.set('wheel-greet', GR); GP.key = ''; return; }
  if (t.dataset.wi != null && WI) { const it = WI.items[+t.dataset.wi], v = t.value.trim();
    if (t.dataset.wf === 'grade') it.grade = v === '' ? null : (isNaN(Number(v)) ? v : Number(v)); else it.possible = v === '' ? null : Number(v);
    t.classList.toggle('changed', !same(t.dataset.wf === 'grade' ? it.grade : it.possible, t.dataset.wf === 'grade' ? it.real : it.realOut)); whatIf(); return; }
  if (t.classList.contains('cell')) t.classList.remove('bad');
  if (t.dataset.f === 'g' && testing() && t.closest('tr.row')) {          // class grades follow what you type
    const a = byIdx(t.closest('tr.row').dataset.i), v = t.value.trim(); if (!a) return;
    if (v === '' || !/^-?[\d.]+(\s*\/\s*[\d.]+|\s*%)?$/.test(v)) delete TEST[kOf(a)]; else TEST[kOf(a)] = isNaN(Number(v)) ? v : Number(v);

});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.dtin !== undefined) {
    const dp = t.parentNode.querySelector('input[type=date]'), y = parseDateText(t.value);
    if (!t.value.trim()) { t.classList.remove('bad'); return; }
    if (!y) { t.classList.add('bad'); return; }
    t.classList.remove('bad'); if (dp.value !== y) { dp.value = y; dp.dispatchEvent(new Event('change', { bubbles: true })); }
    t.value = dayLabel(fromYmd(y)); return;
  }
  if (t.dataset.draft && t.dataset.df) { const d = DRAFTS.find(x => x.id === +t.dataset.draft); if (d) d.f[t.dataset.df] = t.value; if (t.dataset.df === 't') { const s = t.parentNode.querySelector('.dtxt'); if (s) s.value = t.value ? dayLabel(fromYmd(t.value)) : ''; } if (t.dataset.df === 'c') t.style.setProperty('--c', colorFor(t.value)); return; }
  if (t.dataset.cal && t.type === 'checkbox') { toggleCal(t.dataset.cal); return; }
  if (t.dataset.cd) { CD[t.dataset.cd] = t.value; saveCD(); renderAll(); return; }
  if (t.dataset.gr) { GR[t.dataset.gr] = t.type === 'checkbox' ? t.checked : t.value; store.set('wheel-greet', GR); GP.key = ''; return; }
  if (t.dataset.f && t.closest('tr.row')) { const a = byIdx(t.closest('tr.row').dataset.i); if (a) saveCell(a, t.dataset.f, t.value, t); }
});
document.addEventListener('keydown', e => {
  const t = e.target, typing = /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) && !(t.closest('.drawer') && !t.closest('.on'));
  if (e.key === 'Escape' && t.dataset && t.dataset.draft) { DRAFTS = DRAFTS.filter(d => d.id !== +t.dataset.draft); t.blur(); renderAll(); return; }
  if (e.key === 'Escape') { if ($('drawer').classList.contains('on')) closeDrawer(); else if (typing) t.blur(); return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.dtin !== undefined) { e.preventDefault(); const dr = t.closest('tr.draft'); t.blur(); if (dr) setTimeout(() => saveDraft(+dr.dataset.draftRow), 0); return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.draft) { e.preventDefault(); saveDraft(+t.dataset.draft); return; }
  if (e.key === 'Enter' && (t.id === 'td-new' || t.id === 'td-due')) { e.preventDefault(); addTodo(); return; }
  if (e.key === 'Enter' && t.classList && t.classList.contains('cell') && t.closest('tr.row')) { e.preventDefault(); t.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const views = ['dash', 'sheet', 'grades', 'att', 'tasks'];
  if (/^[1-5]$/.test(e.key)) { go(views[+e.key - 1]); return; }
  if (e.key === 'n') { e.preventDefault(); startAdd(); }
  if (e.key === '/') { e.preventDefault(); if (VIEW !== 'sheet') go('sheet'); setTimeout(() => $('sq') && $('sq').focus(), 30); }
});
document.querySelectorAll('.nav').forEach(n => n.addEventListener('click', () => go(n.dataset.view)));
